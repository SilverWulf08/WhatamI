<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#e8f3ed">
	<title>What am I? Quiz</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,20,1;9..144,700,20,1&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--ink: #1a2922;
			--muted: #69766e;
			--paper: #fffdf7;
			--canvas: #e8f3ed;
			--blue: #345fdb;
			--blue-dark: #2547ad;
			--button-bg: #345fdb;
			--button-hover: #284fc1;
			--button-shadow: #2547ad;
			--coral: #ee745e;
			--yellow: #f4c95d;
			--line: #dce5dd;
			--pattern: #aacbb7;
			--panel-border: #d5e4d9;
			--shadow: rgba(43, 87, 59, .08);
			--orbit-line: #bed4c4;
			--sample-paper: #fffaf0;
			--sample-border: #e7e4d8;
			--sample-shadow: #e6eddf;
			--subtle: #87918a;
			--footer-ink: #77867c;
			--progress-track: #d2e3d7;
			--answer-paper: #fff;
			--answer-hover: #f7fbf7;
			--answer-selected: #eef2ff;
			--answer-key-border: #dbe3dc;
			--answer-key-ink: #748078;
			--answer-hover-border: #91b6a0;
			--keyboard-ink: #88938b;
			--trait-label: #536158;
			--trait-track: #e8eee8;
			--trait-value: #869088;
			--result-art: #f8e6d9;
			--result-pattern: #e9bba9;
			--result-ring: rgba(210, 128, 99, .32);
			--secondary-border: #b8cbbd;
			--secondary-hover: #f8fbf6;
			--serif: "Fraunces", Georgia, serif;
			--sans: "DM Sans", "Segoe UI", sans-serif;
		}
		:root[data-theme="dark"] {
			color-scheme: dark;
			--ink: #f1efec;
			--muted: #c0bbb4;
			--paper: #282725;
			--canvas: #191817;
			--blue: #8ba6ff;
			--blue-dark: #3b559d;
			--button-bg: #465eae;
			--button-hover: #526bc2;
			--button-shadow: #304589;
			--coral: #ff9279;
			--yellow: #f8d477;
			--line: #494642;
			--pattern: #292725;
			--panel-border: #403d39;
			--shadow: rgba(0, 0, 0, .2);
			--orbit-line: #514d48;
			--sample-paper: #2b2927;
			--sample-border: #4a4641;
			--sample-shadow: #141312;
			--subtle: #aaa49c;
			--footer-ink: #aaa49c;
			--progress-track: #3c3935;
			--answer-paper: #2d2b29;
			--answer-hover: #373430;
			--answer-selected: #34364a;
			--answer-key-border: #56514b;
			--answer-key-ink: #d0cbc4;
			--answer-hover-border: #7b7165;
			--keyboard-ink: #aaa49c;
			--trait-label: #ddd8d1;
			--trait-track: #413e3a;
			--trait-value: #b6b0a8;
			--result-art: #392d28;
			--result-pattern: #64483b;
			--result-ring: rgba(255, 167, 130, .3);
			--secondary-border: #605950;
			--secondary-hover: #36322e;
		}
		* { box-sizing: border-box; }
		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--canvas);
			background-image: radial-gradient(var(--pattern) 0.75px, transparent 0.75px);
			background-size: 19px 19px;
			font-family: var(--sans);
			transition: background-color .25s ease, color .25s ease;
		}
		button { font: inherit; }
		button:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
		.page { min-height: 100vh; display: flex; flex-direction: column; padding: 26px 34px 20px; }
		.topbar, .footbar { width: min(100%, 1120px); margin-inline: auto; display: flex; align-items: center; justify-content: space-between; }
		.footbar { justify-content: center; }
		.header-actions { display: flex; align-items: center; gap: 18px; }
		.theme-toggle { display: inline-flex; min-height: 36px; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--paper); cursor: pointer; font-size: 12px; font-weight: 700; transition: background .2s ease, border-color .2s ease, color .2s ease; }
		.theme-toggle:hover { border-color: var(--blue); }
		.theme-icon { color: var(--blue); font-size: 17px; line-height: 1; }
		.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
		.brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid var(--ink); border-radius: 50% 50% 46% 54%; font-family: var(--serif); font-size: 20px; transform: rotate(-9deg); }
		.top-note { color: var(--muted); font-size: 12px; font-weight: 600; }
		main { width: min(100%, 1120px); flex: 1; margin: 20px auto 28px; display: grid; place-items: center; }
		.screen { width: 100%; animation: arrive .45s cubic-bezier(.2,.8,.2,1) both; }
		@keyframes arrive { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
		.home { min-height: min(690px, 76vh); display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 48px; padding: 50px 6.2%; border: 1px solid var(--panel-border); border-radius: 8px; background: var(--paper); box-shadow: 0 9px 0 var(--shadow); overflow: hidden; }
		.eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
		.eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); content: ""; }
		h1, h2, p { margin-top: 0; }
		.home h1 { max-width: 540px; margin: 20px 0 18px; font: 600 clamp(60px, 8vw, 104px)/.91 var(--serif); letter-spacing: -.045em; }
		.home h1 span { display: block; color: var(--blue); font-style: italic; }
		.intro { max-width: 410px; margin-bottom: 28px; color: var(--muted); font-size: 16px; line-height: 1.75; }
		.primary, .secondary { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; gap: 14px; padding: 0 21px; border: 0; border-radius: 4px; cursor: pointer; font-weight: 700; transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
		.primary { color: white; background: var(--button-bg); box-shadow: 0 4px 0 var(--button-shadow); }
		.primary:hover { transform: translateY(-2px); background: var(--button-hover); box-shadow: 0 6px 0 var(--button-shadow); }
		.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--button-shadow); }
		.primary .arrow { font-size: 20px; font-weight: 400; }
		.small-note { margin: 20px 0 0; color: var(--subtle); font-size: 12px; }
		.playground { position: relative; min-height: 350px; display: grid; place-items: center; }
		.orbit { position: absolute; width: min(100%, 355px); aspect-ratio: 1; border: 1px dashed var(--orbit-line); border-radius: 50%; animation: turn 45s linear infinite; }
		@keyframes turn { to { transform: rotate(1turn); } }
		.orbit::before, .orbit::after { position: absolute; width: 13px; height: 13px; border-radius: 50%; content: ""; }
		.orbit::before { top: 25px; left: 47px; background: var(--coral); }
		.orbit::after { right: 15px; bottom: 86px; width: 9px; height: 9px; background: var(--blue); }
		.sample { position: relative; z-index: 1; width: min(100%, 290px); padding: 27px 26px 25px; border: 1px solid var(--sample-border); border-radius: 5px; background: var(--sample-paper); box-shadow: 5px 7px 0 var(--sample-shadow); transform: rotate(3deg); animation: float 4.5s ease-in-out infinite; }
		@keyframes float { 50% { transform: rotate(1deg) translateY(-7px); } }
		.sample-kicker { color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
		.sample-emoji { display: block; margin: 17px 0 9px; font-size: 48px; }
		.sample h2 { margin-bottom: 8px; font: 600 26px/1.15 var(--serif); }
		.sample p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
		.spark { position: absolute; top: 25px; right: 9%; color: var(--yellow); font-size: 37px; animation: bob 3s ease-in-out infinite; }
		.spark-two { position: absolute; bottom: 28px; left: 4%; color: var(--coral); font-size: 30px; animation: bob 3.8s ease-in-out infinite reverse; }
		@keyframes bob { 50% { transform: translateY(-9px) rotate(12deg); } }
		.footbar { color: var(--footer-ink); font-size: 11px; }
		.quiz-shell { width: min(100%, 760px); margin: 0 auto; }
		.quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 23px; }
		.question-count { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
		.question-count strong { color: var(--ink); }
		.text-button { padding: 8px 0 8px 8px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; font-weight: 700; }
		.text-button:hover { color: var(--blue); }
		.progress-track { height: 5px; margin-bottom: 37px; overflow: hidden; border-radius: 4px; background: var(--progress-track); }
		.progress-fill { width: 5%; height: 100%; border-radius: inherit; background: var(--coral); transition: width .35s ease; }
		.question-card { padding: clamp(26px, 5vw, 47px); border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: 0 7px 0 var(--shadow); }
		.question-card .eyebrow { margin-bottom: 13px; }
		.question-title { max-width: 620px; min-height: 2.1em; margin: 0 0 26px; font: 600 clamp(27px, 4.2vw, 40px)/1.13 var(--serif); letter-spacing: -.025em; }
		.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
		.answer { display: flex; min-height: 66px; align-items: center; gap: 13px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--answer-paper); cursor: pointer; text-align: left; font-size: 14px; line-height: 1.45; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
		.answer:hover { transform: translateY(-2px); border-color: var(--answer-hover-border); background: var(--answer-hover); }
		.answer.selected { border-color: var(--blue); background: var(--answer-selected); box-shadow: inset 0 0 0 1px var(--blue); }
		.answer-key { display: grid; width: 26px; height: 26px; flex: 0 0 26px; place-items: center; border: 1px solid var(--answer-key-border); border-radius: 50%; color: var(--answer-key-ink); font-size: 11px; font-weight: 700; }
		.answer.selected .answer-key { border-color: var(--blue); color: white; background: var(--blue); }
		.question-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 23px; }
		.question-actions .primary { min-height: 46px; padding-inline: 18px; font-size: 13px; }
		.question-actions .primary:disabled { cursor: not-allowed; opacity: .42; transform: none; box-shadow: 0 4px 0 var(--button-shadow); }
		.keyboard-hint { color: var(--keyboard-ink); font-size: 11px; }
		.result-wrap { width: min(100%, 850px); margin: 0 auto; }
		.result-heading { margin: 0 0 17px; text-align: center; }
		.result-heading .eyebrow { justify-content: center; }
		.result-heading h1 { margin: 13px 0 0; font: 600 clamp(35px, 6vw, 58px)/1.05 var(--serif); letter-spacing: -.035em; }
		.result-card { display: grid; grid-template-columns: .82fr 1.18fr; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); box-shadow: 0 7px 0 var(--shadow); }
		.result-art { position: relative; display: grid; min-height: 350px; place-items: center; overflow: hidden; background-color: var(--result-art); background-image: radial-gradient(var(--result-pattern) .8px, transparent .8px); background-size: 16px 16px; }
		.result-art::before, .result-art::after { position: absolute; width: 190px; height: 190px; border: 1px solid var(--result-ring); border-radius: 50%; content: ""; }
		.result-art::after { width: 240px; height: 240px; }
		.result-emoji { position: relative; z-index: 1; font-size: 104px; filter: drop-shadow(0 9px 1px rgba(90, 53, 35, .12)); animation: reveal .7s cubic-bezier(.2,.8,.2,1) both, bob 3.7s ease-in-out .7s infinite; }
		@keyframes reveal { from { opacity: 0; transform: scale(.65) rotate(-13deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
		.result-copy { padding: clamp(25px, 5vw, 42px); }
		.result-type { color: var(--coral); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
		.result-name { margin: 10px 0 13px; font: 600 clamp(30px, 4vw, 43px)/1.05 var(--serif); letter-spacing: -.025em; }
		.result-description { margin-bottom: 23px; color: var(--muted); font-size: 14px; line-height: 1.75; }
		.traits { display: grid; gap: 11px; }
		.trait { display: grid; grid-template-columns: 93px 1fr 27px; align-items: center; gap: 10px; font-size: 11px; }
		.trait-label { color: var(--trait-label); font-weight: 600; }
		.trait-track { height: 6px; overflow: hidden; border-radius: 9px; background: var(--trait-track); }
		.trait-fill { height: 100%; border-radius: inherit; background: var(--blue); transform-origin: left; animation: fill-in .75s ease both; }
		@keyframes fill-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		.trait-value { color: var(--trait-value); text-align: right; }
		.result-footer { display: flex; justify-content: center; margin-top: 24px; }
		.secondary { min-height: 48px; border: 1px solid var(--secondary-border); color: var(--ink); background: var(--paper); font-size: 13px; }
		.secondary:hover { transform: translateY(-2px); background: var(--secondary-hover); }
		.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
		@media (max-width: 700px) {
			.page { padding: 19px 17px 15px; }
			main { margin-block: 16px 22px; }
			.home { min-height: auto; grid-template-columns: 1fr; gap: 10px; padding: 38px 26px 25px; }
			.home h1 { font-size: clamp(65px, 15vw, 91px); }
			.intro { font-size: 14px; }
			.playground { min-height: 245px; }
			.orbit { width: min(100%, 260px); }
			.orbit::after { right: -2px; bottom: calc(50% - 4px); }
			.sample { width: 235px; padding: 18px 20px; }
			.sample-emoji { margin: 10px 0 5px; font-size: 37px; }
			.sample h2 { font-size: 22px; }
			.playground { min-height: 290px; }
			.spark { z-index: 2; top: 0; right: 5%; font-size: 30px; }
			.spark-two { z-index: 2; bottom: 0; left: 5%; font-size: 26px; }
			.question-card { padding: 25px 19px; }
			.progress-track { margin-bottom: 24px; }
			.answers { grid-template-columns: 1fr; gap: 8px; }
			.answer { min-height: 55px; }
			.result-card { grid-template-columns: 1fr; }
			.result-art { min-height: 205px; }
			.result-emoji { font-size: 77px; }
			.result-art::before { width: 150px; height: 150px; }
			.result-art::after { width: 190px; height: 190px; }
			.result-heading h1 { font-size: 39px; }
			.result-copy { padding: 25px 22px; }
		}
		@media (max-width: 380px) {
			.page { padding-inline: 12px; }
			.home { padding-inline: 20px; }
			.keyboard-hint { display: none; }
			.trait { grid-template-columns: 82px 1fr 25px; }
		}
		@media (max-width: 540px) {
			.top-note { display: none; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="topbar">
			<a class="brand" href="#home" aria-label="What am I? home"><span class="brand-mark" aria-hidden="true">?</span><span>What am I? Quiz</span></a>
			<div class="header-actions"><span class="top-note">A tiny quiz for your big weird self</span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span>Dark mode</span></button></div>
		</header>
		<main id="app" aria-live="polite"></main>
		<footer class="footbar"><span>Made with ❤️ by Silver</span></footer>
	</div>
	<script>
		(() => {
			const visibleTraits = ["wonder", "kindness", "nerve", "calm", "spark", "freedom", "focus", "mischief"];
			const latentTraits = ["novelty", "comfort", "structure", "sensory"];
			const traits = [...visibleTraits, ...latentTraits];
			const QUIZ_QUESTION_COUNT = 20;
			const traitPairs = [
				["wonder", "focus", "structure"], ["kindness", "calm", "comfort"], ["nerve", "freedom", "novelty"], ["spark", "mischief", "sensory"],
				["wonder", "calm", "comfort"], ["kindness", "spark", "sensory"], ["nerve", "focus", "structure"], ["freedom", "mischief", "novelty"],
				["wonder", "freedom", "novelty"], ["kindness", "focus", "comfort"], ["nerve", "spark", "sensory"], ["calm", "mischief", "comfort"],
				["wonder", "mischief", "novelty"], ["kindness", "freedom", "novelty"], ["nerve", "calm", "comfort"], ["spark", "focus", "structure"],
				["wonder", "spark", "sensory"], ["kindness", "mischief", "sensory"], ["nerve", "freedom", "novelty"], ["calm", "focus", "structure"],
				["wonder", "nerve", "novelty"], ["kindness", "calm", "comfort"], ["spark", "freedom", "sensory"], ["focus", "mischief", "structure"]
			];
			const questions = [
				["If you were choosing a car color, which would you pick?", [["Deep forest green", 4], ["Warm silver", 6], ["Bright marigold", 22], ["Cherry red", 17]]],
				["Which mug would you reach for first?", [["A speckled ceramic one", 0], ["A wide mug with a soft handle", 1], ["A travel cup with a lid", 2], ["One shaped like a tiny house", 3]]],
				["Choose a sound for your morning alarm.", [["A few piano notes", 4], ["A familiar radio voice", 5], ["A brisk electronic beat", 6], ["A cartoon sound effect", 7]]],
				["Which jacket would you wear most often?", [["A light raincoat with roomy pockets", 9], ["A soft cardigan", 1], ["A bright windbreaker", 10], ["A secondhand jacket with a story", 12]]],
				["What would you most like to see from your window?", [["A tree canopy", 4], ["A lively street corner", 5], ["A long road into the distance", 2], ["Rooftops and chimneys", 23]]],
				["You have room for one extra thing in your weekend bag. What goes in?", [["A pocket field guide", 0], ["A small tin of favorite snacks", 1], ["A swimsuit, just in case", 8], ["A deck of oddly specific playing cards", 3]]],
				["Choose something to keep on your desk.", [["A small magnifying glass", 0], ["A photo in a simple frame", 1], ["A paperweight from a trip", 8], ["A toy that makes a ridiculous noise", 3]]],
				["Which ice cream flavor sounds best today?", [["Pistachio", 4], ["Strawberry", 5], ["Lemon sorbet", 10], ["Chocolate with popping candy", 23]]],
				["Pick a pair of everyday shoes.", [["Canvas shoes in a muted color", 8], ["Soft slippers", 1], ["Sturdy walking boots", 2], ["Bright sneakers with mismatched laces", 3]]],
				["Which candle would you light in the evening?", [["Cedar and rain", 4], ["Vanilla and warm bread", 1], ["Citrus and ginger", 10], ["A scent called ‘haunted attic’", 7]]],
				["Choose a notebook cover.", [["A constellation map", 0], ["Soft blue linen", 1], ["A bright geometric pattern", 10], ["A ridiculous drawing of a fish", 3]]],
				["Which bicycle would you take for a ride?", [["A classic city bike with a basket", 16], ["A comfortable cruiser", 1], ["A light bike built for hills", 2], ["A tiny folding bike in a loud color", 22]]],
				["What would you pack for a picnic?", [["Olives, cheese, and crusty bread", 0], ["A big thermos of soup to share", 1], ["Fruit and something fizzy", 10], ["A mystery assortment from the corner shop", 7]]],
				["Which plant would you put on a windowsill?", [["A tiny cactus with an unusual shape", 0], ["A leafy pothos", 4], ["A pot of bright marigolds", 10], ["A carnivorous plant with a funny name", 3]]],
				["Choose a lamp for a reading corner.", [["A small adjustable desk lamp", 0], ["A paper lantern", 1], ["A tall arc lamp", 2], ["A mushroom-shaped lamp", 3]]],
				["Which sofa would you choose for a living room?", [["A neat two-seater in dark green", 19], ["A deep, soft sectional", 1], ["A low modular sofa you can rearrange", 8], ["A yellow velvet sofa", 22]]],
				["Pick a way to explore a new place.", [["Wander through side streets", 8], ["Take a scenic train ride", 1], ["Rent a bike and cover a lot of ground", 2], ["Follow a parade or street musician", 22]]],
				["Choose wallpaper for a small room.", [["A subtle botanical print", 4], ["A warm, faded stripe", 19], ["A bold color block", 10], ["Tiny illustrated frogs", 7]]],
				["What would you put on a playlist for a long drive?", [["Instrumental music", 0], ["Songs everyone knows the words to", 5], ["Fast music with a strong beat", 2], ["A mix of theme songs and oddities", 7]]],
				["Choose a breakfast for a slow morning.", [["Toast with marmalade", 4], ["Pancakes to put in the middle of the table", 5], ["A savory breakfast wrap", 6], ["Cereal eaten from a mug", 7]]],
				["Which umbrella would you carry?", [["A compact black one", 19], ["A clear dome umbrella", 16], ["A large sturdy storm umbrella", 2], ["One covered in tiny ducks", 3]]],
				["Set the temperature for your ideal room.", [["Cool enough for a blanket", 4], ["Warm with a window cracked open", 13], ["A little chilly and energizing", 6], ["Whatever it is outside", 22]]],
				["Pick a keychain for your keys.", [["A little brass compass", 8], ["A smooth wooden bead", 1], ["A bright enamel lightning bolt", 10], ["A miniature rubber chicken", 23]]],
				["Which path would you take through a park?", [["The one beside the old trees", 4], ["The path that passes the café", 5], ["The steep path up to the viewpoint", 2], ["The winding path with odd sculptures", 7]]],

			themeButton.addEventListener("click", () => setTheme(currentTheme === "dark" ? "light" : "dark"));
			setTheme(currentTheme, false);
			const escapeHtml = (text) => text.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
			const shuffle = (items) => {
				const copy = [...items];
				for (let index = copy.length - 1; index > 0; index--) {
					const swap = Math.floor(Math.random() * (index + 1));
					[copy[index], copy[swap]] = [copy[swap], copy[index]];
				}
				return copy;
			};
			const showHome = () => {
				run = null;
				app.innerHTML = `
					<section class="screen home" aria-labelledby="home-title">
						<div class="home-copy">
							<span class="eyebrow">A personality quiz with extra whimsy</span>
							<h1 id="home-title">What am <span>I?</span></h1>
							<p class="intro">A little animal, a very specific snack, a secret superpower… answer a few curious questions and meet the many things you might be.</p>
							<button class="primary" id="start" type="button">Let's find out <span class="arrow" aria-hidden="true">→</span></button>
							<p class="small-note">20 questions · 48 possible outcomes · no wrong answers</p>
						</div>
						<div class="playground" aria-label="A sample result: moonlit otter">
							<span class="spark" aria-hidden="true">✳</span><span class="spark-two" aria-hidden="true">✳</span>
							<div class="orbit" aria-hidden="true"></div>
							<article class="sample"><span class="sample-kicker">A possible you</span><span class="sample-emoji" aria-hidden="true">🦦</span><h2>Moonlit otter</h2><p>Curious, cozy, and always up for one more little adventure.</p></article>
						</div>
					</section>`;
				document.querySelector("#start").addEventListener("click", startQuiz);
			};
			const startQuiz = () => {
				const order = shuffle(questions.map((_, index) => index)).slice(0, QUIZ_QUESTION_COUNT);
				run = {
					order,
					answerOrders: order.map((questionIndex) => shuffle(questions[questionIndex][1].map((_, index) => index))),
					answers: Array(QUIZ_QUESTION_COUNT).fill(null),
					current: 0
				};
				renderQuestion();
			};
			const renderQuestion = () => {
				const position = run.current;
				const question = questions[run.order[position]];
				const answerOrder = run.answerOrders[position];
				const chosen = run.answers[position];
				app.innerHTML = `
					<section class="screen quiz-shell" aria-labelledby="question-title">
						<div class="quiz-top"><span class="question-count">Question <strong>${position + 1}</strong> of ${QUIZ_QUESTION_COUNT}</span><button class="text-button" id="quit" type="button">Back to home ↗</button></div>
						<div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${QUIZ_QUESTION_COUNT}" aria-valuenow="${position}"><div class="progress-fill" style="width:${(position / QUIZ_QUESTION_COUNT) * 100}%"></div></div>
						<div class="question-card">
							<span class="eyebrow">Go with your first hunch</span>
							<h1 class="question-title" id="question-title">${escapeHtml(question[0])}</h1>
							<div class="answers" role="group" aria-label="Choose an answer">${answerOrder.map((choiceIndex, displayIndex) => { const [label] = question[1][choiceIndex]; return `<button class="answer${chosen === choiceIndex ? " selected" : ""}" type="button" data-answer="${choiceIndex}" aria-pressed="${chosen === choiceIndex}"><span class="answer-key" aria-hidden="true">${displayIndex + 1}</span><span>${escapeHtml(label)}</span></button>`; }).join("")}</div>
							<div class="question-actions"><button class="text-button" id="previous" type="button" ${position === 0 ? "disabled aria-disabled=\"true\"" : ""}>← Previous</button><span class="keyboard-hint">Tip: keys 1–4 work too</span><button class="primary" id="next" type="button" ${chosen === null ? "disabled" : ""}>${position === QUIZ_QUESTION_COUNT - 1 ? "See my result" : "Continue"}<span class="arrow" aria-hidden="true">→</span></button></div>
						</div>
					</section>`;
				document.querySelector("#quit").addEventListener("click", showHome);
				document.querySelector("#previous").addEventListener("click", () => { if (run.current > 0) { run.current--; renderQuestion(); } });
				document.querySelectorAll("[data-answer]").forEach((button) => button.addEventListener("click", () => {
					run.answers[position] = Number(button.dataset.answer);
					document.querySelectorAll("[data-answer]").forEach((option) => {
						const selected = option === button;
						option.classList.toggle("selected", selected);
						option.setAttribute("aria-pressed", String(selected));
					});
					document.querySelector("#next").disabled = false;
				}));
				document.querySelector("#next").addEventListener("click", () => {
					if (run.answers[position] === null) return;
					if (position === QUIZ_QUESTION_COUNT - 1) showResult();
					else { run.current++; renderQuestion(); }
				});
			};
			const scoreOutcomes = () => {
				const totals = Object.fromEntries(traits.map((trait) => [trait, 0]));
				const opportunities = Object.fromEntries(traits.map((trait) => [trait, 0]));
				run.order.forEach((questionIndex, position) => {
					const choices = questions[questionIndex][1];
					const available = new Set(choices.flatMap((choice) => choice.slice(1)));
					available.forEach((trait) => { opportunities[trait]++; });
					const selectedTraits = choices[run.answers[position]].slice(1);
					selectedTraits.forEach((trait) => { totals[trait]++; });
				});
				const observed = Object.fromEntries(traits.map((trait) => [trait, (totals[trait] + 0.65) / (opportunities[trait] + 1.3)]));
				const ranked = outcomes.map((outcome, index) => {
					const coreProfile = [...outcome[4]].map((value) => 0.12 + Number(value) * 0.08);
					const core = Object.fromEntries(visibleTraits.map((trait, traitIndex) => [trait, coreProfile[traitIndex]]));
					const profile = [
						...coreProfile,
						(core.wonder + core.nerve + core.freedom) / 3,
						(core.kindness + core.calm) / 2,
						(core.focus + core.calm) / 2,
						(core.wonder + core.spark + core.mischief) / 3
					];
					let traitError = 0;
					let traitWeight = 0;
					traits.forEach((trait, traitIndex) => {
						const reliability = opportunities[trait] / (opportunities[trait] + 3);
						const weight = 0.55 + reliability;
						traitError += weight * (observed[trait] - profile[traitIndex]) ** 2;
						traitWeight += weight;
					});
					let answerLoss = 0;
					run.order.forEach((questionIndex, position) => {
						const choices = questions[questionIndex][1];
						const utilities = choices.map((choice) => choice.slice(1).reduce((sum, trait) => sum + profile[traits.indexOf(trait)], 0) / (choice.length - 1));
						const probability = utilities[run.answers[position]] / utilities.reduce((sum, value) => sum + value, 0);
						answerLoss -= Math.log(probability);
					});
					  const patternFit = answerLoss / (run.order.length * Math.log(4));
					const fit = (traitError / traitWeight) * 0.55 + patternFit * 0.45;
					return { outcome, index, fit, observed };
				}).sort((left, right) => left.fit - right.fit || left.index - right.index);
				return ranked[0];
			};
			const showResult = () => {
				const { outcome, observed } = scoreOutcomes();
				const [name, emoji, category, description] = outcome;
				const sortedTraits = [...visibleTraits].sort((left, right) => observed[right] - observed[left]).slice(0, 4);
				app.innerHTML = `
					<section class="screen result-wrap" aria-labelledby="result-title">
						<div class="result-heading"><span class="eyebrow">The universe has a hunch</span><h1 id="result-title">You might be…</h1></div>
						<article class="result-card">
							<div class="result-art" aria-hidden="true"><span class="result-emoji">${emoji}</span></div>
							<div class="result-copy"><span class="result-type">Your what-am-I type · ${escapeHtml(category)}</span><h2 class="result-name">${escapeHtml(name)}</h2><p class="result-description">${escapeHtml(description)}</p>
								<div class="traits" aria-label="Your strongest traits">${sortedTraits.map((trait) => `<div class="trait"><span class="trait-label">${trait[0].toUpperCase() + trait.slice(1)}</span><div class="trait-track"><div class="trait-fill" style="width:${Math.round(observed[trait] * 100)}%"></div></div><span class="trait-value">${Math.round(observed[trait] * 100)}%</span></div>`).join("")}</div>
							</div>
						</article>
						<div class="result-footer"><button class="secondary" id="home-again" type="button">← Back to the homescreen</button></div>
					</section>`;
				document.querySelector("#home-again").addEventListener("click", showHome);
			};
			document.addEventListener("keydown", (event) => {
				if (!run || !document.querySelector("#question-title")) return;
				if (["1", "2", "3", "4"].includes(event.key)) document.querySelectorAll("[data-answer]")[Number(event.key) - 1]?.click();
				if (event.key === "Enter" && run.answers[run.current] !== null) document.querySelector("#next")?.click();
			});
			document.querySelector(".brand").addEventListener("click", (event) => { event.preventDefault(); showHome(); });
			showHome();
		})();
	</script>
</body>
</html>
